<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            body { background: black; color: white; font-family: monospace; text-align: center; }
            .button-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
            button { background: #222; color: white; border: 1px solid white; }
        </style>
    </head>

    <body>
        <h2 id="astronautHeader">Astronaut</h2>
        <br>

        <div class="button-container">
            <button onclick="increaseHeartRate()">Increase heart rate</button>
            <button onclick="decreaseHeartRate()">Lower heart rate</button>
            
            <button onclick="increaseSPO2()">Increase SPO2 Level</button>
            <button onclick="decreaseSPO2()">Lower SPO2 Level</button>

            <button onclick="increaseRespRate()">Increase respiration rate</button>
            <button onclick="decreaseRespRate()">Lower respiration rate</button>

            <button onclick="increaseTemp()">Increase temperature</button>
            <button onclick="decreaseTemp()">Lower temperature</button>
        </div>

        <script> 
            const pathSegments = window.location.pathname.split('/');
            const astronautId = pathSegments[2];

            document.getElementById('astronautHeader').innerText = `Astronaut ${astronautId}`;

            function increaseHeartRate() { fetch(`/astronaut/${astronautId}/increaseHeartRate`); }
            function decreaseHeartRate() { fetch(`/astronaut/${astronautId}/decreaseHeartRate`); }

            function increaseSPO2() { fetch(`/astronaut/${astronautId}/increaseSPO2`); }
            function decreaseSPO2() { fetch(`/astronaut/${astronautId}/decreaseSPO2`); }

            function increaseRespRate() { fetch(`/astronaut/${astronautId}/increaseRespRate`); }
            function decreaseRespRate() { fetch(`/astronaut/${astronautId}/decreaseRespRate`); }

            function increaseTemp() { fetch(`/astronaut/${astronautId}/increaseTemp`); }
            function decreaseTemp() { fetch(`/astronaut/${astronautId}/decreaseTemp`); }
    </script>
    </body>
</html>
